name: Auto Release

# Fires when a PR is merged to main.
# Requires one of these labels on the PR:
#   release:patch  →  0.x.Y bump  (bug fixes, docs, minor improvements)
#   release:minor  →  0.X.0 bump  (new features, backwards-compatible)
#   release:major  →  X.0.0 bump  (breaking changes)
#
# PRs without a release label are merged normally with no publish.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: |
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
       contains(github.event.pull_request.labels.*.name, 'release:minor') ||
       contains(github.event.pull_request.labels.*.name, 'release:major'))

    runs-on: ubuntu-latest
    permissions:
      contents: write   # push version bump commit and tag
      id-token: write   # OIDC Trusted Publishing to npm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Determine version bump type
        id: bump
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}" == "true" ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}" == "true" ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version in package.json
        id: version
        run: |
          npm version ${{ steps.bump.outputs.type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=v${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Commit and tag
        run: |
          NEW_TAG="${{ steps.version.outputs.new_version }}"
          if git fetch --tags && git tag | grep -q "^${NEW_TAG}$"; then
            echo "Tag ${NEW_TAG} already exists — skipping commit and tag (re-run recovery)"
            git checkout package.json
          else
            git add package.json
            git commit -m "chore: release ${NEW_TAG}"
            git tag "${NEW_TAG}"
            git pull --rebase --autostash origin main
            git push origin main
            git push origin "${NEW_TAG}"
          fi

      - name: Checkout published tag for publish
        run: |
          git fetch --tags
          git checkout "${{ steps.version.outputs.new_version }}"

      - name: Publish to npm (OIDC Trusted Publishing)
        run: npx --package=npm@11 --yes -- npm publish --provenance --access public
