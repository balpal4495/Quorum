name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g npm@11
        name: Upgrade to npm v11 (required for OIDC Trusted Publishing)

      - run: npm --version

      - run: npm ci

      - run: npm test

      - run: npm publish --provenance --access public
