name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.4.2)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - run: npm test

      - name: Publish via npm v11 (OIDC Trusted Publishing)
        run: npx --package=npm@11 --yes -- npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
